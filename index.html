<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect With Me</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #16161f;
            --text-color: #ffffff;
            --accent-color: #7000ff;
            --accent-hover: #8a33ff;
            --text-muted: #8b8b9f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: var(--card-bg);
            padding: 40px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-color), #b000ff);
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .username {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .main-btn {
            position: relative;
            display: block;
            background: var(--accent-color);
            color: #fff;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, background 0.2s;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(112, 0, 255, 0.3);
        }

        .main-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .main-btn:active {
            transform: translateY(0);
        }

        /* Pulse animation to draw attention to your guns.lol */
        .main-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 14px;
            border: 2px solid var(--accent-color);
            animation: pulse 2s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.08); opacity: 0; }
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 24px 0;
        }

        .links-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .secondary-btn {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 12px;
            transition: background 0.2s, transform 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Picture / Placeholder Emoji -->
        <div class="profile-img">👋</div>
        
        <h1>Welcome</h1>
        <p class="username">enastros</p>

        <!-- Primary Target Link -->
        <a href="https://guns.lol/catdogfish" class="main-btn" target="_blank">🎴 Visit My Guns.lol Profile</a>

        <div class="divider"></div>
        <p class="links-title">Other Channels</p>

        <!-- Secondary Optional Links -->
        <a href="https://instagram.com" class="secondary-btn" target="_blank">Instagram</a>
        <a href="https://twitter.com" class="secondary-btn" target="_blank">X / Twitter</a>
        <a href="https://youtube.com" class="secondary-btn" target="_blank">YouTube</a>
    </div>

</body>
</html>
